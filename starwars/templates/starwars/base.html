<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Звёздные войны{% endblock %}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0d0d0d 60%);
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        header {
            background: rgba(0, 0, 0, 0.6);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        header .logo { font-size: 1.4rem; font-weight: bold; color: #ffe81f; letter-spacing: 1px; }
        header nav a { color: #bbb; text-decoration: none; margin-left: 20px; font-weight: bold; }
        header nav a:hover { color: #ffe81f; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #ffe81f; border-bottom: 2px solid #ffe81f; display: inline-block; padding-bottom: 5px; }
        .error {
            background: #3b0a0a;
            border: 1px solid #ff6b6b;
            color: #ffb3b3;
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        ul.film-list { list-style: none; padding: 0; margin-top: 30px; }
        ul.film-list li { margin-bottom: 12px; }
        ul.film-list a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            border: 1px solid #2e2e2e;
            border-left: 5px solid #ffe81f;
            border-radius: 8px;
            padding: 16px 20px;
            color: #f5f5f5;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
        }
        ul.film-list a:hover { background: #262626; transform: translateX(5px); }
        ul.film-list .episode { color: #ffe81f; font-weight: bold; }
        ul.film-list .meta { color: #888; font-size: 0.9em; }
        .episode-badge {
            display: inline-block;
            background: #ffe81f;
            color: #0d0d0d;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .crawl {
            font-style: italic;
            line-height: 1.8;
            color: #ffe81f;
            text-align: justify;
            background: #1a1a1a;
            border: 1px solid #2e2e2e;
            padding: 20px 25px;
            border-radius: 8px;
            white-space: pre-line;
        }
        .info-table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        .info-table th, .info-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #2e2e2e; }
        .info-table th { color: #ffe81f; width: 180px; }
        ul.entities {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0;
        }
        ul.entities li {
            background: #1a1a1a;
            border: 1px solid #2e2e2e;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.9em;
            color: #ccc;
        }
        .back { margin-top: 30px; display: inline-block; color: #ffe81f; text-decoration: none; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⭐ ЗВЁЗДНЫЕ ВОЙНЫ</div>
        <nav>
            <a href="/">Главная</a>
            <a href="{% url 'film_list' %}">Фильмы</a>
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
