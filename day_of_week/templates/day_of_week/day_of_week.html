<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сегодня — {{ day_name }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: {{ background }};
            color: white;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
            transition: background 1s ease;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 50px 60px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 5rem;
            margin: 0;
            font-weight: bold;
        }
        .subtitle {
            font-size: 1.5rem;
            margin-top: 10px;
        }
        .back {
            margin-top: 30px;
        }
        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 25px;
            transition: background 0.3s;
        }
        .back a:hover {
            background: white;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ day_name }}</h1>
        <div class="subtitle">— сегодняшний день недели</div>
        <div class="back">
            <a href="/">← На главную</a>
        </div>
    </div>
</body>
</html>
