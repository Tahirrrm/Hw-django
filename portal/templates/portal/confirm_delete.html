{% extends 'portal/base_admin.html' %}
{% block title %}Подтверждение удаления{% endblock %}
{% block heading %}Подтверждение{% endblock %}
{% block content %}
<div class="card">
    <p>Вы уверены, что хотите удалить {{ object_label }}? Действие необратимо.</p>
    <form method="post" action="{{ url }}">
        {% csrf_token %}
        <button class="btn btn-red" type="submit">Да, удалить</button>
        <a class="btn btn-gray" href="javascript:history.back()">Отмена</a>
    </form>
</div>
{% endblock %}
