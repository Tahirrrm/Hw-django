{% extends 'portal/base_public.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card">
    <h1>Регистрация</h1>
    {% if errors %}
    <div class="error">{% for e in errors %}{{ e }}<br>{% endfor %}</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Логин<input type="text" name="username" value="{{ username|default:'' }}" required></label>
        <label>Email (необязательно)<input type="email" name="email" value="{{ email|default:'' }}"></label>
        <label>Пароль<input type="password" name="password" required></label>
        <button class="btn btn-blue" type="submit">Создать аккаунт</button>
    </form>
</div>
{% endblock %}
